[package]
name = "ljos-consensus"
version = "0.5.0"
edition = "2021"
rust-version = "1.89"
license = "MIT"
repository = "https://github.com/leidarljos/consensus"
description = "DeGroot / Friedkin–Johnsen over a trust graph; Seldon ODE when seldon is on PATH"

[[bin]]
name = "ljos-consensus"
path = "src/main.rs"

[dependencies]
libc = "0.2"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[build-dependencies]
cc = "1"

[dev-dependencies]
approx = "0.5"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(seldon_capi)'] }
