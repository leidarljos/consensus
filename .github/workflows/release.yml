name: release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Builds the release for a tag that already exists, with this workflow and
  # the tag's own source. The tag is not moved.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release, such as v0.9.0"
        required: true
        type: string

permissions:
  contents: write
  # The CI job lists workflow runs for the tagged commit.
  actions: read
  # The build attestations: a signed statement that this workflow built
  # each archive, which `gh attestation verify` and the ljos installer check.
  id-token: write
  attestations: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  ci:
    name: CI on this sha is green
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.green.outputs.sha }}
    steps:
      - name: CI on this sha is green
        id: green
        uses: ./.github/actions/ci-green
        with:
          tag: ${{ env.TAG }}

  build:
    needs: ci
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.os }}
    env:
      TARGET: ${{ matrix.target }}
      CI_SHA: ${{ needs.ci.outputs.sha }}
    steps:
      - name: The tag names a release
        run: |
          set -eu
          echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: The tag is the crate version
        run: |
          set -eu
          crate=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml)
          test -n "$crate"
          test "v$crate" = "$TAG"
      - name: This is the commit CI passed
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$CI_SHA"
      # rust-toolchain.toml pins the compiler, and cargo builds with the pin
      # whatever the action sets as default. The target goes on the pin.
      - name: The pinned toolchain
        id: pin
        run: |
          set -eu
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
          targets: ${{ matrix.target }}
      - name: The target is installed for the pin
        run: rustup target list --installed | grep -qx "$TARGET"
      - run: cargo build --locked --release --target "$TARGET" -p ljos-consensus
      - run: |
          set -eu
          name="consensus-${TAG}-${TARGET}"
          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/ljos-consensus" "dist/$name/"
          cp README.md CHANGELOG.md LICENSE* "dist/$name/" 2>/dev/null || true
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*
  release:
    needs: [ci, build]
    runs-on: ubuntu-latest
    env:
      CI_SHA: ${{ needs.ci.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
      - name: This is the commit CI passed
        run: |
          set -eu
          test "$(git rev-parse HEAD)" = "$CI_SHA"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # A signed statement that this workflow built each archive, which
      # `gh attestation verify` and the ljos installer check.
      - uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: dist/*.tar.gz
      - name: Release notes from the changelog
        run: |
          awk -v v="${TAG#v}" '$0 ~ "^## "v {p=1; next} /^## /{if(p) exit} p' CHANGELOG.md > notes.md
          test -s notes.md || echo "See CHANGELOG.md." > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          body_path: notes.md
          files: dist/*
