name: derive

on:
  push:
    branches: [main]
    paths: ["derive/**", "src/**", "examples/**", "scripts/**", ".github/workflows/derive.yml"]
  pull_request:
    paths: ["derive/**", "src/**", "examples/**", "scripts/**", ".github/workflows/derive.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sympy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q sympy
      - run: python derive/sympy/fj.py
      - run: python derive/sympy/jury.py
      # The goldens the Rust tests read must be what the script derives.
      - run: python derive/sympy/golden.py && git diff --exit-code derive/golden

  sollya:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y --no-install-recommends sollya
      # Sollya's quit takes no status; the verdict is the last line.
      - run: sollya derive/sollya/rounding.sollya | tee /dev/stderr | grep -qx 'all certificates hold'
      - run: sollya derive/logit_lipschitz.sollya | tee /dev/stderr | grep -qx certified

  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          lake-package-directory: derive/lean
          use-mathlib-cache: true
          build: true

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q sympy mpmath
      - run: python3 scripts/verify_fj.py
      - run: cargo run --release --example synthetic_voters -- 9 400 20 expert
      - run: cargo run --release --example correlated_voters -- 5 4 400 20
      - run: cargo run --release --example correlation_history -- 5 4 1000

  licenses:
    name: cargo deny check licenses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.89.0
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check licenses
        run: cargo deny check licenses
