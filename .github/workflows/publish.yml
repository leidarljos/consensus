name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Publishes the tag that already exists, from that tag's own source.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, such as v0.9.0"
        required: true
        type: string

permissions:
  contents: read
  # The gate lists workflow runs for the tagged commit.
  actions: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    # The gate waits on the push workflows.
    # A cold check on two hosts is fmt, clippy and the suite.
    # Half an hour covers that and the queue.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # Same gate as release.yml. The publish step runs only after it.
      - name: CI on this sha is green
        id: ci
        uses: ./.github/actions/ci-green
        with:
          tag: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - name: Publish ljos-consensus
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p ljos-consensus
