name: publish

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  # Publishes the tag that already exists, from that tag's own source.
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, such as v0.9.0"
        required: true
        type: string

permissions:
  contents: read
  # The gate lists workflow runs for the tagged commit.
  actions: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      # Same gate as release.yml. The publish step runs only after it.
      - name: CI on this sha is green
        id: ci
        uses: ./.github/actions/ci-green
        with:
          tag: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1.0.5
        id: auth
      - name: Publish ljos-consensus
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --locked --no-verify -p ljos-consensus
