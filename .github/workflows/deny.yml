name: deny

# Not part of derive.yml. That workflow only runs for derive paths, and a
# weekly schedule on it would also run the sympy, sollya and lean jobs.
on:
  push:
    branches: [main]
  pull_request:
  # cargo deny fetches the advisory DB from GitHub, so this runs even when
  # the repo has not changed. Monday morning, so a weekend advisory is
  # visible before the week's tags. 06:17 UTC is off the hour: GitHub
  # delays and sometimes drops scheduled runs that pile up at minute 0.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      # rust-toolchain.toml pins the compiler. Installing a fixed channel
      # here would download a second toolchain once that pin moves.
      - name: The pinned toolchain
        id: pin
        run: |
          set -eu
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      # Built from source, so the job pulls no image from Docker Hub.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        id: deny
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}
      - name: Build cargo-deny 0.20.2 from source
        if: steps.deny.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: cargo deny check
        run: cargo deny check
