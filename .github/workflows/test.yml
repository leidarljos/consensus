name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q sympy
      - run: python3 scripts/verify_fj.py
