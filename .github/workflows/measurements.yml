name: measurements

on:
  push:
    branches: [main]
    paths:
      - "measurements/replay_history.txt"
      - "measurements/replay_independent.txt"
      - "measurements/replay_panel.json"
      - "measurements/replay_panel_independent.json"
      - "measurements/correlation_history-0-7-4000.txt"
      - "measurements/correlation_gate-20000.txt"
      - "measurements/settle_budget.txt"
      - "examples/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/check_measurements.py"
      - ".github/workflows/measurements.yml"
  pull_request:
    paths:
      - "measurements/replay_history.txt"
      - "measurements/replay_independent.txt"
      - "measurements/replay_panel.json"
      - "measurements/replay_panel_independent.json"
      - "measurements/correlation_history-0-7-4000.txt"
      - "measurements/correlation_gate-20000.txt"
      - "measurements/settle_budget.txt"
      - "examples/**"
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "scripts/check_measurements.py"
      - ".github/workflows/measurements.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rust-toolchain.toml pins the compiler. Installing stable here
      # downloads a second toolchain, which cargo then ignores.
      - name: The pinned toolchain
        id: pin
        run: |
          set -eu
          channel=$(sed -n 's/^channel *= *"\(.*\)"/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: ${{ steps.pin.outputs.channel }}
      - name: Replay the recorded measurement commands
        run: python3 scripts/check_measurements.py
