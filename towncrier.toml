[tool.towncrier]
name = "consensus"
directory = "changelog.d"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
title_format = "## {version} ({project_date})"
issue_format = "[#{issue}](https://github.com/leidarljos/consensus/pull/{issue})"
underlines = ["", "", ""]
# towncrier fails `build` on a fragment name with no configured type only
# when `ignore` is set (checked on towncrier 24.8.0 and 26.9.0). An empty
# list turns that check on. Dotfiles such as `.gitkeep` are skipped either way.
ignore = []

[[tool.towncrier.type]]
directory = "feature"
name = "Features"
showcontent = true

[[tool.towncrier.type]]
directory = "bugfix"
name = "Fixes"
showcontent = true

[[tool.towncrier.type]]
directory = "doc"
name = "Documentation"
showcontent = true

[[tool.towncrier.type]]
directory = "removal"
name = "Removals"
showcontent = true

[[tool.towncrier.type]]
directory = "misc"
name = "Miscellaneous"
showcontent = true
