# Licenses this workspace may depend on. CI runs `cargo deny check licenses`.

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]
confidence-threshold = 0.8
exceptions = [
    # cbindgen writes the C header at build time; none of it is linked.
    { crate = "cbindgen", allow = ["MPL-2.0"] },
]
