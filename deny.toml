# Licenses this workspace may depend on. CI runs `cargo deny check`.
# An allowance the tree does not use would admit that license with no review.

[licenses]
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8
exceptions = [
    # cbindgen writes the C header at build time; none of it is linked.
    { crate = "cbindgen", allow = ["MPL-2.0"] },
]
